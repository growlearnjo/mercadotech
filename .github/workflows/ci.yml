# CI de MercadoTech (Fase 6.7). El portero automático: nadie tiene que
# acordarse de correr los tests.
#
# Dos jobs encadenados. `checks` es rápido y sin Docker; `e2e` solo arranca si
# el primero pasó, porque levantar un Supabase efímero para descubrir que hay
# un error de tipos es tirar 5 minutos de runner a la basura.
#
# CERO SECRETOS. Los E2E no afirman respuestas de IA (decisión 8 de la spec),
# así que no hace falta el token de Hugging Face; y las claves del Supabase
# efímero son las estándar de cualquier stack local, no protegen nada
# (decisión 11) — se leen en caliente y mueren con el job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la corrida anterior: nadie mira el
# resultado de un commit que ya quedó obsoleto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: este workflow no publica nada ni escribe en el repo.
permissions:
  contents: read

env:
  # Debe COINCIDIR con "packageManager" de package.json (decisión 10).
  #
  # LECCIÓN YA PAGADA (ReadHub): el lockfile de este repo se generó en Windows
  # con npm 11.6.2. Un npm más nuevo en el runner Linux resuelve distinto las
  # dependencias OPCIONALES por plataforma y `npm ci` revienta con
  # "npm error `npm ci` can only install packages when your package.json and
  # package-lock.json are in sync… Missing <paquete> from lock file". El pin
  # exacto lo evita sin tener que regenerar el lockfile en cada máquina.
  NPM_VERSION: "11.6.2"
  NODE_VERSION: "24"

jobs:
  checks:
    name: Lint, tipos y tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pinnear npm a la versión que generó el lockfile
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Los unitarios NO tocan la red: el cliente de Supabase se inyecta y
      # lib/ai/* se mockea por módulo. Por eso este job no necesita Docker.
      - name: Tests unitarios con cobertura
        run: npm run test:coverage

      - name: Type-check del servidor MCP
        working-directory: mcp
        run: |
          npm ci
          npm run type-check

      # `if: always()` para poder mirar la cobertura también cuando algo falló
      # después: es justo cuando más se necesita.
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E con Playwright
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pinnear npm a la versión que generó el lockfile
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Instalar dependencias
        run: npm ci

      # Los navegadores pesan ~300 MB: se cachean por hash del lockfile, que es
      # lo que fija la versión de @playwright/test.
      - name: Restaurar caché de navegadores
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Solo chromium: en CI el valor está en la regresión rápida, no en la
      # matriz de motores. Los 3 navegadores quedan para local (Fase 6.4).
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Instalar el CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Docker ya viene en ubuntu-latest: no hay que instalarlo.
      - name: Levantar el Supabase efímero
        run: supabase start

      - name: Aplicar migraciones y seed
        run: supabase db reset

      # Decisión 11: NO son secretos. Son las claves estándar de cualquier
      # Supabase local, y este stack se destruye al terminar el job. Se leen
      # en caliente en vez de fijarlas para que no se rompan si el CLI las
      # cambia en una versión futura.
      - name: Leer credenciales del Supabase local
        id: supabase
        run: |
          STATUS=$(supabase status -o json)
          echo "api_url=$(echo "$STATUS" | jq -r '.API_URL')" >> "$GITHUB_OUTPUT"
          echo "anon_key=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> "$GITHUB_OUTPUT"
          echo "service_role_key=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_OUTPUT"

      # El workflow NO levanta la app: de eso se encarga el `webServer` de
      # playwright.config.ts, que en CI hace `build && start` para probar
      # contra el build de producción (decisión 12).
      - name: Correr los E2E
        run: npx playwright test --project=chromium
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # Solo en fallo: en verde nadie abre este artefacto y pesa decenas de MB
      # por los vídeos.
      - name: Subir el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Detener el Supabase efímero
        if: always()
        run: supabase stop
